name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build web assets and sync to Android
        run: npm run sync
      - name: Build debug APK (폰에 바로 설치해 보는 테스트용)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ssokbrain-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 출시용 AAB: 서명 키를 Secrets 에 넣은 뒤에만 실행됩니다.
      - name: Decode keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ssok.keystore"
      - name: Build release AAB (플레이 콘솔에 올리는 파일)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
          SSOK_KEYSTORE_FILE: ${{ runner.temp }}/ssok.keystore
          SSOK_KEYSTORE_PASSWORD: ${{ secrets.SSOK_KEYSTORE_PASSWORD }}
          SSOK_KEY_ALIAS: ${{ secrets.SSOK_KEY_ALIAS }}
          SSOK_KEY_PASSWORD: ${{ secrets.SSOK_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
        with:
          name: ssokbrain-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
