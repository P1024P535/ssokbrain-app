name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build web assets and sync to Android
        run: npm run sync
      - name: Build debug APK (폰에 바로 설치해 보는 테스트용)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ssokbrain-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK to Releases (폰에서 바로 내려받는 링크)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ssokbrain-test.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest ssokbrain-test.apk --title "테스트용 설치 파일" --notes "가장 최근 빌드의 테스트용 APK입니다. 광고는 테스트 광고가 나오고, 결제는 플레이 콘솔에 상품을 등록하기 전까지 동작하지 않습니다." --prerelease --target "$GITHUB_SHA"

      # 출시용 AAB: 서명 키를 Secrets 에 넣은 뒤에만 실행됩니다.
      - name: Decode keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ssok.keystore"
      - name: Build release AAB (플레이 콘솔에 올리는 파일)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
          SSOK_KEYSTORE_FILE: ${{ runner.temp }}/ssok.keystore
          SSOK_KEYSTORE_PASSWORD: ${{ secrets.SSOK_KEYSTORE_PASSWORD }}
          SSOK_KEY_ALIAS: ${{ secrets.SSOK_KEY_ALIAS }}
          SSOK_KEY_PASSWORD: ${{ secrets.SSOK_KEY_PASSWORD }}
        run: |
          # 붙여 넣을 때 섞여 들어간 빈칸, 줄바꿈, 보이지 않는 문자를 걸러냅니다.
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\41-\176'; }
          export SSOK_KEYSTORE_PASSWORD="$(clean "$SSOK_KEYSTORE_PASSWORD")"
          export SSOK_KEY_PASSWORD="$(clean "$SSOK_KEY_PASSWORD")"
          export SSOK_KEY_ALIAS="$(clean "$SSOK_KEY_ALIAS")"
          echo "lengths: store password ${#SSOK_KEYSTORE_PASSWORD} (expected 20), key password ${#SSOK_KEY_PASSWORD} (expected 20), alias ${#SSOK_KEY_ALIAS} (expected 9)"
          cd .. && SSOK_RELEASE=1 npm run sync && cd android
          ./gradlew bundleRelease --no-daemon
      - name: Publish release AAB to Releases (플레이 콘솔에 올리는 파일)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ssokbrain-release.aab
          gh release upload test-latest ssokbrain-release.aab --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SSOK_KEYSTORE_BASE64 }}
        with:
          name: ssokbrain-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
